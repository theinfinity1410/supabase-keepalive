name: supabase-keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only select 1 on each project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          fail=0
          for ref in xcqrbouaueebzycrotrb vfhfeerzdpucaofkmmir; do
            code=$(curl -sS -m 30 -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$ref/database/query/read-only" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"query":"select 1 as ok"}')
            echo "$ref http=$code"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then fail=1; fi
          done
          exit $fail
      - name: Read-only REST and auth requests with anon keys
        continue-on-error: true
        env:
          CLIO_ANON_KEY: ${{ secrets.SUPABASE_CLIO_ANON_KEY_V2 }}
          DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY_V2 }}
        run: |
          fail=0
          probe() {
            name=$1; ref=$2; key=$(printf %s "$3" | tr -d '[:space:]"')
            echo "$name key length=${#key}"
            code=$(curl -sS -m 30 -o /tmp/rest.json -w '%{http_code}' "https://$ref.supabase.co/rest/v1/keepalive_probe?select=*&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
            echo "$name rest http=$code"
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then fail=1; fi
            code=$(curl -sS -m 30 -o /tmp/auth.json -w '%{http_code}' "https://$ref.supabase.co/auth/v1/settings" -H "apikey: $key")
            echo "$name auth http=$code"
            if [ "$code" != "200" ]; then fail=1; fi
          }
          probe clio xcqrbouaueebzycrotrb "$CLIO_ANON_KEY"
          probe swayam_dev vfhfeerzdpucaofkmmir "$DEV_ANON_KEY"
          exit $fail
      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "theinfinity1410"
          git config user.email "swayamgosavi1410@gmail.com"
          git add heartbeat.txt
          git commit -m "heartbeat $(date -u +%F)"
          git push
